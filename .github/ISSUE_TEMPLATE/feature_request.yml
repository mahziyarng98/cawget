name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation and what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could Cawget help? Mock-ups or examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
