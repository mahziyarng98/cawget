[package]
name = "cawget"
description = "Cawget Download Manager desktop app (Tauri shell around the cawget-core engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
# Embed the built frontend instead of loading the dev server URL. `tauri dev` turns it off.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cawget-core = { path = "../../crates/cawget-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
tokio-util = "0.7"
dirs = "7"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through Tauri/GTK; used to check for a tray host on the session bus.
gio = "0.18"
