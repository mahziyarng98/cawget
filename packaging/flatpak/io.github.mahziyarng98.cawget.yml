# Flatpak manifest for Cawget (Tauri 2 + Rust + Svelte frontend).
# Phase B draft; source of truth for the decisions: FLATPAK_AUDIT.md
# (/tmp/cawget-flatpak-audit-report/FLATPAK_AUDIT.md).
#
# Verified on the build machine: org.gnome.Platform//51 and org.gnome.Sdk//51
# are installed; GNOME 51 is built on Freedesktop 26.08;
# org.freedesktop.Sdk.Extension.rust-stable//26.08 and node24//26.08 are
# installed; libwebkit2gtk-4.1.so.0 exists in the runtime.
#
# Still UNVERIFIED (see README.md + audit report):
# - exact D-Bus talk/own names required by the tray (StatusNotifier) under
#   Flatpak's filtered session bus
# - whether tauri-plugin-dialog (rfd) and tauri-plugin-opener go through the
#   XDG portals in the sandbox
# - Flathub build behaviour for this dependency set on aarch64
app-id: io.github.mahziyarng98.cawget
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: cawget
sdk-extensions:
  # No branch suffix on purpose: flatpak-builder matches sdk-extensions
  # against the org.freedesktop.Sdk branch of the selected SDK (see the
  # flatpak-builder-tools cargo/README.md and node/README.md examples, which
  # list them without a branch). For GNOME 51 (Freedesktop 26.08) that means
  # org.freedesktop.Sdk.Extension.rust-stable//26.08 and
  # org.freedesktop.Sdk.Extension.node24//26.08, both installed.
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
rename-desktop-file: cawget.desktop
rename-icon: cawget
copy-icon: true
finish-args:
  # Downloads are the app's core feature (add_downloads/probe_url, HTTP client).
  - --share=network
  # Tauri v2 window on Wayland, with X11 fallback.
  - --socket=wayland
  - --socket=fallback-x11
  # Required by Flathub whenever the X11 socket is requested (MIT-SHM).
  - --share=ipc
  # WebKitGTK/GTK rendering.
  - --device=dri
  # Default download folder is $HOME/Downloads when it exists
  # (crates/cawget-core/src/settings.rs); ":create" lets the app create it.
  - --filesystem=xdg-download:create
  # Tray icon registers with a StatusNotifier host on the session bus
  # (gui/src-tauri/src/main.rs). UNVERIFIED: confirm the exact talk/own
  # names with `flatpak run --log-session-bus`.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Credentials are stored in the system keyring (Secret Service: GNOME Keyring /
  # KWallet) via keyring-core and its zbus Secret Service store; the sandbox
  # must be allowed to talk to the Secret Service daemon on the session bus.
  - --talk-name=org.freedesktop.secrets
modules:
  # The tray icon loads libayatana-appindicator at runtime through the
  # libappindicator crate (Cargo.lock: tray-icon -> libappindicator ->
  # libloading), so the library must be present inside the sandbox. The
  # Flathub shared-modules recipe builds it (and its deps) from source.
  # These JSON/patch files are copies of flathub/shared-modules@master; use a
  # git submodule instead when submitting to Flathub (see README.md).
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # Frontend build (vite/Svelte) fully offline from node-sources.json
  # (generated by flatpak-node-generator).
  - name: gui
    buildsystem: simple
    subdir: gui
    build-options:
      append-path: /usr/lib/sdk/node24/bin
      env:
        npm_config_cache: /run/build/gui/flatpak-node/npm-cache
    build-commands:
      - npm ci --offline --no-audit --no-fund
      - npm run build
      # Stash the built frontend for the Rust module, which embeds it via the
      # tauri "custom-protocol" feature (frontendDist ../dist in tauri.conf.json).
      - mkdir -p ${FLATPAK_DEST}/lib/cawget
      - cp -r dist ${FLATPAK_DEST}/lib/cawget/gui-dist
    sources:
      - type: git
        url: https://github.com/mahziyarng98/cawget.git
        tag: v0.1.1
        commit: e66eed52cdfec065fe45f64d96d36c516ec1e9bb
      # node-sources.json lives next to this manifest (packaging/flatpak/);
      # flatpak-builder resolves relative source paths against the manifest
      # file's directory. It is generated from gui/package-lock.json by
      # flatpak-node-generator (see build-local.sh).
      - node-sources.json

  # Rust workspace: the cawget binary (Tauri shell + download engine).
  - name: cawget
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cawget/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # Feed the frontend built by the gui module into the ../dist location
      # that tauri.conf.json's frontendDist expects.
      - cp -r ${FLATPAK_DEST}/lib/cawget/gui-dist gui/dist
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo build --offline --release -p cawget --features custom-protocol
      - install -Dm0755 target/release/cawget ${FLATPAK_DEST}/bin/cawget
      - install -Dm0644 packaging/cawget.desktop ${FLATPAK_DEST}/share/applications/cawget.desktop
      - install -Dm0644 gui/src-tauri/icons/64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/cawget.png
      - install -Dm0644 gui/src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/cawget.png
      - install -Dm0644 gui/src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/cawget.png
      - install -Dm0644 gui/src-tauri/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/cawget.png
      - install -Dm0644 gui/assets/brand/cawget-app-icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/cawget.svg
      # Flatpak-specific metainfo (next to this manifest): identical to
      # packaging/io.github.mahziyarng98.cawget.metainfo.xml except that the
      # launchable is io.github.mahziyarng98.cawget.desktop (the desktop file is
      # renamed to the app ID below), so no post-install patching is needed.
      - install -Dm0644 io.github.mahziyarng98.cawget.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.mahziyarng98.cawget.metainfo.xml
      - install -Dm0644 LICENSE ${FLATPAK_DEST}/share/licenses/io.github.mahziyarng98.cawget/LICENSE
      - install -Dm0644 NOTICE ${FLATPAK_DEST}/share/licenses/io.github.mahziyarng98.cawget/NOTICE
      - install -Dm0644 THIRD_PARTY_LICENSES.md ${FLATPAK_DEST}/share/licenses/io.github.mahziyarng98.cawget/THIRD_PARTY_LICENSES.md
    sources:
      - type: git
        url: https://github.com/mahziyarng98/cawget.git
        tag: v0.1.1
        commit: e66eed52cdfec065fe45f64d96d36c516ec1e9bb
      # cargo-sources.json lives next to this manifest; it is generated from
      # the workspace-root Cargo.lock by flatpak-cargo-generator (see
      # build-local.sh). gui/src-tauri's crate "cawget" is a workspace member,
      # so its dependencies are already in the single root Cargo.lock.
      - cargo-sources.json
      - type: file
        path: io.github.mahziyarng98.cawget.metainfo.xml
