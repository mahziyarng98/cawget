[package]
name = "cawget-core"
description = "Segmented HTTP/HTTPS download engine: parallel ranges, resume, queue, scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "system-proxy", "socks"] }
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
httpdate = "1"
percent-encoding = "2"
rustix = { version = "1", features = ["fs"] }
bytes = "1"
sha2 = "0.11"
dirs = "7"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
cawget-testserver = { path = "../cawget-testserver" }
